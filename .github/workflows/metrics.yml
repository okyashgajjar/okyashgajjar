name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Core Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: okyashgajjar
          template: classic
          filename: github-metrics.svg
          config_timezone: Asia/Kolkata
          config_display: large
          config_output: svg
          retries: 3
          retries_delay: 120
          committer_message: "Update github-metrics.svg - [Skip GitHub Action]"

          # Base only - fastest config
          base: header, activity, community, repositories, metadata
          base_indepth: no

          # Languages
          plugin_languages: yes
          plugin_languages_limit: 8

          # Isometric calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
